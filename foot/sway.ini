shell = /usr/bin/zsh

font = GoMono Nerd Font:pixelsize=20:antialias=true
font-bold = GoMono Nerd Font:style=Bold:pixelsize=20:antialias=true
font-italic = GoMono Nerd Font:style=Italic:pixelsize=20:antialias=true
font-bold-italic = GoMono Nerd Font:style=Bold Italic:pixelsize=20:antialias=true

dpi-aware=yes
pad=9x9 center
vertical-letter-offset=-1px
line-height=24px
letter-spacing=-1px
bold-text-in-bright=palette-based
resize-delay-ms=90

[cursor]
style=beam
blink=yes

[bell]
urgent=yes
notify=yes
visual=yes

[mouse]
hide-when-typing=yes
alternate-scroll-mode=no

[url]
launch=xdg-open ${url}

[colors]
background=0a0202
foreground=eeeeee
alpha=0.45
flash=ffffff

regular0=000000
bright0=121212
regular1=e9305a
bright1=f9406a
regular2=9bb474
bright2=abc584
regular3=c2ad65
bright3=d2bd75
regular4=87a7cc
bright4=97b7dc
regular5=e26239
bright5=f27248
regular6=93ece6
bright6=a3fcf6
regular7=eeeeee
bright7=ffffff
urls=ff0000
